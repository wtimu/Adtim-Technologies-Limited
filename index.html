<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adtim Technologies Limited</title>
  <link rel="icon" type="image/x-icon" href="Adtim/images/icons/fav.ico">
  
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Owl Carousel CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Baloo+Chettan|Dosis:400,600,700|Poppins:400,600,700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #FFC300;
      color: #000000;
      margin: 0;
      padding-top: 140px; /* Added for fixed header */
    }
    
    /* Header */
    .header_section {
      background: url('Adtim/images/servers.jpg') no-repeat center center/cover;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 10px 0;
      border-bottom: 3px solid #FFC300;
    }
    
    .header_section::after {
      content: "";
      position: absolute;
      top:0; left:0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }
    
    .header_section .container {
      position: relative;
      z-index: 1;
    }
    
    .navbar-brand {
      display: flex;
      align-items: center;
    }
    
    .navbar-brand img {
      height: 100px;
      margin-right: 15px;
    }
    
    .brand-text h1 {
      margin: 0;
      font-size: 60px;
      color: #FFC300;
      line-height: 1;
    }
    
    .brand-text h2 {
      margin: 0;
      font-size: 24px;
      color: #ffffff;
      line-height: 1;
    }
    
    /* Mobile menu button positioning */
    .navbar-toggler {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1001;
    }
    
    /* Links */
    a {
      text-decoration: none !important;
      color: inherit;
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    a:hover {
      background: rgba(255, 195, 0, 0.2);
    }
    
    /* Footer */
    .footer_section {
      background: #000000;
      color: #ffffff;
      padding: 20px 0;
    }
    
    .footer_section .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .social_box {
      display: flex;
      gap: 15px;
    }
    
    .social_box a img {
      width: 20px;
      height: auto;
      transition: transform 0.3s;
    }
    
    .social_box a:hover img {
      transform: scale(1.1);
    }
    
    /* Responsive Adjustments */
    @media (max-width: 768px) {
      body {
        padding-top: 100px;
      }
      
      .navbar-brand .brand-text h1 {
        font-size: 36px;
      }
      
      .navbar-brand img {
        height: 60px;
      }
      
      .footer_section .container {
        flex-direction: column;
        text-align: center;
      }
      
      .social_box {
        margin-top: 15px;
      }
    }
    
    /* Rest of your existing styles remain the same */
    /* ... */
    
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header_section">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center py-2">
        <a class="navbar-brand" href="index.html">
          <img src="Adtim/images/Logo Small.png" alt="Adtim Technologies Logo">
          <div class="brand-text">
            <h1>ADTIM</h1>
            <h2>TECHNOLOGIES</h2>
          </div>
        </a>
        
        <!-- Mobile Menu Button -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsMain">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="top-nav-info d-none d-md-block">
          <ul class="d-flex list-unstyled mb-0">
            <li class="mr-3">
              <a href="tel:+256704251030">
                <img src="Adtim/images/telephone.png" alt="Telephone Icon">
                +256 704 251030
              </a>
            </li>
            <li class="mr-3">
              <a href="mailto:support@adtimtech.com">
                <img src="Adtim/images/mail.png" alt="Email Icon">
                support@adtimtech.com
              </a>
            </li>
            <li>
              <a href="#">
                <img src="Adtim/images/location.png" alt="Location Icon">
                Kampala-Uganda
              </a>
            </li>
          </ul>
        </div>
      </div>
      
      <nav class="navbar navbar-expand-md navbar-light">
        <div class="collapse navbar-collapse" id="navbarsMain">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item active">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Adtim/about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Adtim/services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="Adtim/contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <!-- Rest of your HTML content remains the same -->
  <!-- ... -->

  <!-- Footer -->
  <footer class="footer_section">
    <div class="container">
      <p>&copy; 2025 All Rights Reserved. Design by <a href="https://twitter.com/wtimu">Timothy</a></p>
      <div class="social_box">
        <a href="https://www.facebook.com/profile.php?id=61558137210437"><img src="Adtim/images/facebook.png" alt="Facebook"></a>
        <a href="https://twitter.com/wtimu"><img src="Adtim/images/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="Adtim/images/linkedin.png" alt="LinkedIn"></a>
        <a href="https://www.instagram.com/wtimu/"><img src="Adtim/images/instagram.png" alt="Instagram"></a>
        <a href="https://www.youtube.com/channel/UCDuTMfXOVdlIc350jBxNktg"><img src="Adtim/images/youtube.png" alt="YouTube"></a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
  <script>
    $(document).ready(function(){
      $('.owl_carousel1').owlCarousel({
        loop: true,
        margin: 25,
        nav: true,
        navText: ["<i class='fa fa-chevron-left'></i>", "<i class='fa fa-chevron-right'></i>"],
        autoplay: true,
        autoplayHoverPause: true,
        responsive: {
          0: { items: 1 },
          600: { items: 2 },
          1000: { items: 3 }
        }
      });
    });
  </script>
</body>
</html>
